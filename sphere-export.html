<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tacit — Sphere frame export</title>
    <style>
      html,
      body {
        margin: 0;
        background: #18232e;
      }
      #frames {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px;
      }
      .frame {
        display: grid;
        gap: 8px;
        justify-items: center;
      }
      .frame canvas {
        display: block;
        background: #18232e;
      }
      .frame span {
        font: 12px ui-monospace, monospace;
        color: #8a9ba8;
      }
    </style>
  </head>
  <body>
    <div id="frames"></div>
    <script type="module" src="/src/sphere-export.ts"></script>
  </body>
</html>
